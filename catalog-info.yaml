apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: support-agent
  description: Customer-facing AI agent that answers shipment questions and can delegate routing questions to the routing agent.
  annotations:
    github.com/project-slug: backstage-john/aurora-support-agent
    backstage.io/techdocs-ref: dir:.
  tags:
    - ai-agent
    - a2a
    - python
spec:
  type: agent
  lifecycle: production
  owner: group:default/team-ai-agents
  system: system:default/customer-experience
  providesApis:
    - support-agent-a2a
  consumesApis:
    - routing-agent-a2a
    - mcp-gateway
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: support-agent-a2a
  description: Agent2Agent (A2A) surface for customer support conversations.
spec:
  type: a2a
  lifecycle: production
  owner: group:default/team-ai-agents
  system: system:default/customer-experience
  definition:
    $text: ./.well-known/agent.json
